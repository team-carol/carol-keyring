; carol-keyring firmware
; 패널은 빌드할 때 환경(env)으로 지정한다. 펌웨어는 그 패널 정보를 BLE Info로 알려 준다.

[platformio]
default_envs = preview_e6

[env]
platform = espressif32@7.1.3
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
; 무선 업데이트에는 펌웨어 자리(OTA 파티션)가 두 개 필요하다. default.csv 는 app0/app1 각 1.25MB.
board_build.partitions = default.csv
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D FW_VERSION=\"0.1.0\"
    -D FW_ENV=\"$PIOENV\"

; 패널 없이 개발: 받은 프레임을 시리얼에 ASCII로 출력한다. Info는 1.54" 6색과 같다.
[env:preview_e6]
build_flags =
    ${env.build_flags}
    -D PANEL_PREVIEW_E6

; 패널 없이 개발: Info는 Seeed 2.13" 4색과 같다.
[env:preview_bwry]
build_flags =
    ${env.build_flags}
    -D PANEL_PREVIEW_BWRY

; Seeed 2.13" 4색(흑백적황) 122x250 + XIAO ePaper 드라이버 보드
[env:seeed213_bwry]
build_flags =
    ${env.build_flags}
    -D PANEL_SEEED213_BWRY

; Waveshare 1.54inch e-Paper Module (E), Spectra 6, 240x240
[env:ws154_e6]
build_flags =
    ${env.build_flags}
    -D PANEL_WS154_E6

; Seeed 2.13" 흑백 122x250 + XIAO ePaper 드라이버 보드 (개발용)
[env:seeed213_bw]
lib_deps =
    ${env.lib_deps}
    zinggjm/GxEPD2@1.6.9
build_flags =
    ${env.build_flags}
    -D PANEL_SEEED213_BW
